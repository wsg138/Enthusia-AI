name: Temporary Codacy annotation diagnostic

on:
  push:
    branches:
      - runtime/ticket-evidence-review-service

permissions:
  checks: read
  contents: read

jobs:
  codacy-annotations:
    runs-on: ubuntu-latest
    steps:
      - name: Print Codacy tool and pattern metadata
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/Enthusia-AI/pull-requests/64/issues?status=new&limit=100"
          payload="$(curl -fsSL "${url}")"

          echo "Top-level keys:"
          jq -r 'keys[]' <<<"${payload}"

          echo "First issue keys:"
          jq -r '(.data // .issues // .)[0] | keys[]' <<<"${payload}"

          echo "Issue metadata:"
          jq -r '
            (.data // .issues // .)[] |
            [
              (.tool.name // .tool.uuid // .tool // ""),
              (.patternInfo.id // .patternInfo.title // .patternId // .pattern // ""),
              (.category // .patternInfo.category // ""),
              (.level // .severity // ""),
              (.filePath // .file.path // .path // ""),
              ((.lineNumber // .line // .startLine // 0) | tostring),
              (.message // .description // "")
            ] | @tsv
          ' <<<"${payload}" | head -n 120
