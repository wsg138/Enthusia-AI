name: Temporary Codacy tool diagnostic

on:
  push:
    branches:
      - runtime/ticket-evidence-review-service

permissions:
  contents: read

jobs:
  codacy-tool:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Codacy issue tool metadata
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/Enthusia-AI/pull-requests/64/issues?status=new&limit=100"
          payload="$(curl -fsSL "${url}")"
          echo "DATA_KEYS"
          jq -r '.data | keys[]' <<<"${payload}"
          echo "DATA_SHAPE"
          jq -c '.data | if type=="object" then with_entries(.value = (if (.value|type)=="array" then {"type":"array","length":(.value|length)} else {"type":(.value|type)} end)) else {"type":type} end' <<<"${payload}"
          echo "RAW_FIRST_LEVEL"
          jq -c '.data' <<<"${payload}" | head -c 12000
          echo
