name: Temporary Codacy complexity diagnostic

on:
  push:
    branches:
      - runtime/bounded-video-evidence

permissions:
  contents: read

jobs:
  codacy-complexity:
    runs-on: ubuntu-latest
    steps:
      - name: Print current PR 73 Codacy issues
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/Enthusia-AI/pull-requests/73/issues?status=new&limit=100"
          payload="$(curl -fsSL "$url")"
          jq -r '.data[] | [
            .commitIssue.patternInfo.category,
            .commitIssue.filePath,
            (.commitIssue.lineNumber | tostring),
            .commitIssue.patternInfo.id,
            .commitIssue.message
          ] | @tsv' <<<"$payload"
