name: Temporary Codacy diagnostics

on:
  push:
    branches:
      - integration/live-moderation-contract

jobs:
  codacy-pr-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public Codacy PR issues
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          base = "https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/Enthusia-AI/pull-requests/75/issues"
          url = base + "?" + urllib.parse.urlencode({"status": "new", "limit": "100"})
          req = urllib.request.Request(
              url,
              headers={"Accept": "application/json", "User-Agent": "enthusia-ci-diagnostic"},
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              body = json.load(response)
          print(json.dumps(body.get("data", []), indent=2, sort_keys=True))
          PY
