[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "enthusia-finetune"
version = "0.1.0"
description = "Enthusia AI fine-tune/export pipeline (W19): dataset assembly, budget-gated training configs, GGUF export, eval hooks."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8"]
gpu = [
  "torch>=2.8",
  "transformers==5.19.0",
  "peft==0.21.2",
  "trl==1.14.1",
  "datasets>=4,<5",
  "accelerate>=1.10,<2",
  "safetensors>=0.6",
]

[project.scripts]
finetune = "enthusia_finetune.pipeline:main"

[tool.setuptools.packages.find]
include = ["enthusia_finetune*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
