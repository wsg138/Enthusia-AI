[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enthusia-generation"
version = "0.1.0"
description = "Synthetic training-corpus generation for Enthusia AI (W17)"
requires-python = ">=3.10"

[project.scripts]
generate-corpus = "enthusia_generation.corpus:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["enthusia_generation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
