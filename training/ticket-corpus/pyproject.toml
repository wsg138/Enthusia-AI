[project]
name = "enthusia-ticket-corpus"
version = "0.1.0"
description = "Enthusia AI ticket corpus pipeline (W18): fixture-driven ticket extraction, redaction, secret removal, quality labeling, outdated marking"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["enthusia_ticket_corpus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
