[project]
name = "enthusia-ticket-corpus"
version = "0.1.0"
description = "Enthusia AI ticket corpus pipeline (W18): governed ticket ingestion, redaction, secret removal, quality labeling, outdated marking"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
enthusia-ticket-ingest = "enthusia_ticket_corpus.real_ingest:main"
enthusia-ticket-rewrite-queue = "enthusia_ticket_corpus.rewrite_queue:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["enthusia_ticket_corpus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
